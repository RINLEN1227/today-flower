<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>今日花签</title>
<style>
  :root{
    --bg:#0D1211;
    --ink:#F2EBDF;
    --dim:#8B968F;
    --red:#C9534A;
    --line:rgba(242,235,223,.13);
    --ambient:min(640px,68vh,92vw);
    --ambient-half:min(320px,34vh,46vw);
    --core:clamp(96px,23%,126px);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"KaiTi","STKaiti","Kaiti SC","楷体",serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  /* 一点点暖光，落在画面中上部，不让整块黑死掉 */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(92% 62% at 50% 40%,rgba(201,83,74,.06),rgba(201,83,74,0) 70%);
  }

  .screen{
    position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    opacity:0;visibility:hidden;z-index:1;
    transition:opacity .55s cubic-bezier(.2,.7,.3,1),visibility .55s;
  }
  .screen.on{opacity:1;visibility:visible;z-index:2}
  .inner{
    min-height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:56px 24px;
  }

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .px{line-height:0;display:flex;justify-content:center}
  .px canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

  /* ---------- 封面 ---------- */
  .kicker{
    font-family:Georgia,"Times New Roman",serif;
    font-size:10px;letter-spacing:.36em;text-transform:uppercase;color:#5E6862;
    margin-bottom:18px;
  }
  .cover-head{
    position:fixed;left:0;right:0;
    top:calc(50vh - var(--ambient-half) - 104px);
    text-align:center;z-index:3;pointer-events:none;
    transition:opacity .4s ease,transform .4s ease;
  }
  .cover-head.out{opacity:0;transform:translateY(-10px)}
  .cover-head h1{margin:0}

  /* 开始页和答题页共用这一层背景 */
  .ambient{
    position:fixed;left:50%;top:50%;
    width:var(--ambient);height:var(--ambient);
    transform:translate(-50%,-50%) scale(1);
    transform-origin:center;
    display:grid;place-items:center;
    z-index:1;pointer-events:none;
    opacity:1;
    transition:opacity .55s ease;
    will-change:transform,opacity;
  }
  .ambient::before{
    content:"";position:absolute;inset:16%;border-radius:50%;
    background:radial-gradient(circle,rgba(201,83,74,.14),rgba(201,83,74,0) 70%);
    pointer-events:none;
  }
  .ambient canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #orbit-canvas{z-index:0}
  #orbit-front{z-index:2;pointer-events:none}
  .ambient.dim{opacity:.95}
  .ambient.off{opacity:0}
  /* 答题页把花环放大一圈，题目才能坐在花环里面 */
  .ambient.quiz{
    width:min(640px,78vh,96vw);
    height:min(640px,78vh,96vw);
  }
  .ambient .core-ring,.ambient .core{transition:opacity .45s ease}
  .ambient.core-off .core-ring,.ambient.core-off .core{opacity:0;pointer-events:none}
  #s-intro{pointer-events:none}

  #handoff{
    position:fixed;inset:0;width:100%;height:100%;
    z-index:50;pointer-events:none;display:none;
  }
  #handoff.on{display:block}

  /* 过渡页 */
  .waiting{transition:opacity .35s ease}
  .waiting.out{opacity:0}
  /* 结果页量尺寸时先把动画压平 */
  .card.no-rv .rv{animation:none;opacity:1;transform:none}
  .stage.hold{visibility:hidden}

  .core-ring{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    z-index:1;width:var(--core);height:var(--core);border-radius:50%;
    background:radial-gradient(circle at 50% 42%,rgba(201,83,74,.08),rgba(13,18,17,.28) 72%);
    border:1px solid rgba(242,235,223,.38);
    box-shadow:0 0 0 10px rgba(13,18,17,.28),0 0 58px rgba(201,83,74,.16);
    transition:border-color .35s,background .35s,box-shadow .35s,opacity .45s;
  }
  .core{
    position:relative;z-index:3;pointer-events:auto;
    width:var(--core);height:var(--core);
    padding:0;border:0;border-radius:50%;background:none;cursor:pointer;
    display:grid;place-items:center;
    font-family:inherit;font-size:16px;letter-spacing:.28em;text-indent:.28em;
    color:var(--ink);
    text-shadow:0 0 12px rgba(13,18,17,.95),0 0 5px rgba(13,18,17,.9),0 1px 2px rgba(13,18,17,.9);
    transition:color .3s,opacity .45s;
  }
  .core::before{
    content:"";position:absolute;left:50%;top:50%;
    width:84%;height:84%;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle,rgba(13,18,17,.38),rgba(13,18,17,0) 70%);
    z-index:-1;pointer-events:none;
  }
  .core:hover,.core:focus-visible{color:#fff;outline:none}
  .ambient:has(.core:hover) .core-ring{
    border-color:var(--red);
    background:radial-gradient(circle at 50% 42%,rgba(201,83,74,.24),rgba(13,18,17,.28) 72%);
    box-shadow:0 0 0 10px rgba(13,18,17,.28),0 0 72px rgba(201,83,74,.32);
  }

  /* ---------- 答题 ---------- */
  .quizbox{position:relative;width:100%;max-width:440px;display:flex;flex-direction:column}
  /* 题目下面压一层柔和的暗光，花环仍留在四周 */
  .quizbox::before{
    content:"";position:absolute;left:50%;top:50%;
    width:min(500px,96vw);height:calc(100% + 150px);
    transform:translate(-50%,-50%);
    background:radial-gradient(ellipse at center,rgba(13,18,17,.58) 0%,rgba(13,18,17,.32) 52%,rgba(13,18,17,0) 78%);
    z-index:-1;pointer-events:none;
  }
  .qbar{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:Georgia,serif;font-size:10.5px;letter-spacing:.24em;color:#6E7A72;
    text-shadow:0 0 8px rgba(13,18,17,.9);
  }
  .qbar b{color:var(--red);font-weight:400;font-size:12px;letter-spacing:.18em}
  .prog{height:1px;background:var(--line);margin-top:14px;position:relative;overflow:hidden}
  .prog i{
    position:absolute;left:0;top:0;height:1px;width:0;display:block;
    background:var(--red);transition:width .45s cubic-bezier(.2,.7,.3,1);
  }

  .qwrap{
    margin-top:42px;min-height:300px;
    transition:opacity .18s ease,transform .18s ease;
  }
  .qwrap.out{opacity:0;transform:translateY(-8px)}

  .qtext{
    font-size:21px;line-height:1.8;letter-spacing:.05em;color:#F2EBDF;
    min-height:2.4em;
    text-shadow:0 0 16px rgba(13,18,17,.92),0 0 4px rgba(13,18,17,.85);
  }
  .opts{margin-top:30px}

  .opt{
    display:flex;align-items:flex-start;gap:16px;width:100%;
    padding:17px 4px 17px 0;border:0;border-top:1px solid var(--line);
    background:none;cursor:pointer;text-align:left;
    font-family:inherit;font-size:16px;line-height:1.65;
    letter-spacing:.04em;color:#C4BDAF;
    text-shadow:0 0 10px rgba(13,18,17,.9);
    transition:color .22s,padding-left .22s;
  }
  .opt:last-child{border-bottom:1px solid var(--line)}
  .opt i{
    font-family:Georgia,serif;font-style:normal;
    font-size:11px;letter-spacing:.1em;color:#58615B;
    padding-top:6px;flex:none;width:13px;
    transition:color .22s;
  }
  .opt:hover{color:#F2EBDF;padding-left:10px}
  .opt:hover i{color:var(--red)}
  .opt.sel{color:#F2EBDF;padding-left:10px}
  .opt.sel i{color:var(--red)}

  .back{
    margin-top:26px;align-self:flex-start;
    background:none;border:0;cursor:pointer;
    font-family:Georgia,serif;font-size:10.5px;letter-spacing:.24em;
    color:#5A635D;padding:8px 0;transition:color .25s,opacity .3s;
  }
  .back:hover{color:var(--red)}
  .back[disabled]{opacity:0;pointer-events:none}

  /* ---------- 过渡 ---------- */
  .waiting{text-align:center}
  .waiting p{font-size:14px;letter-spacing:.16em;color:#A9A296}
  .dots{display:inline-flex;gap:7px;margin-left:12px;vertical-align:middle}
  .dots i{width:4px;height:4px;background:var(--red);opacity:.2;animation:blink 1.15s infinite}
  .dots i:nth-child(2){animation-delay:.18s}
  .dots i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,100%{opacity:.15}50%{opacity:.95}}

  /* ---------- 花笺 ---------- */
  #s-result{scrollbar-gutter:stable}
  .card{width:100%;max-width:420px;text-align:center}
  /* 英文名：只在上侧正中留一行 */
  .eyebrow{
    font-family:Georgia,"Times New Roman",serif;font-style:italic;
    font-size:11px;letter-spacing:.26em;text-transform:uppercase;
    color:var(--dim);margin-bottom:20px;
  }
  .stage{position:relative;display:grid;place-items:center;margin-bottom:22px}
  .stage::before{
    content:"";position:absolute;width:82%;height:82%;left:9%;top:9%;
    background:radial-gradient(circle,rgba(190,58,52,.15) 0%,rgba(190,58,52,0) 68%);
    pointer-events:none;
  }
  .stage canvas{
    width:320px;height:320px;position:relative;
    image-rendering:pixelated;image-rendering:crisp-edges;
  }
  .huayu{
    display:inline-block;margin-top:14px;
    font-size:14px;letter-spacing:.18em;color:var(--red);
  }
  .echo{
    margin-top:15px;font-size:12.5px;line-height:1.9;
    letter-spacing:.05em;color:#79837B;
  }
  .rule{width:32px;height:1px;background:var(--line);margin:26px auto}
  .words p{
    font-size:16px;line-height:2.05;color:#DCD5C8;letter-spacing:.04em;
  }
  .words p + p{margin-top:13px}
  .words p:last-child{color:var(--ink)}
  .acts{margin-top:30px;display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
  .acts button,.acts a{
    background:none;border:0;cursor:pointer;
    font-family:inherit;font-size:13px;letter-spacing:.2em;
    color:#98A19A;text-decoration:none;padding:8px 2px;
    border-bottom:1px solid transparent;transition:color .25s,border-color .25s;
  }
  .acts button:hover,.acts a:hover{color:var(--ink);border-color:var(--red)}

  .rv{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  @media (max-width:420px){
    .inner{padding:44px 22px}
    .qtext{font-size:19px}
    .opt{font-size:15px;padding:17px 4px 17px 0}
    .qwrap{margin-top:42px;min-height:320px}
    .stage canvas{width:256px;height:256px}
    .words p{font-size:15px;line-height:1.98}
  }
  @media (max-height:720px){
    .inner{padding:34px 24px}
    :root{--ambient:min(560px,62vh,92vw);--ambient-half:min(280px,31vh,46vw)}
  }
</style>
</head>
<body>

<!-- 开始页与答题页共用的背景：一圈花 + 一团光粒 -->
<div class="ambient" id="ambient">
  <canvas id="orbit-canvas" aria-hidden="true"></canvas>
  <div class="core-ring" aria-hidden="true"></div>
  <canvas id="orbit-front" aria-hidden="true"></canvas>
  <button class="core" id="start" type="button">开始</button>
</div>

<!-- 结果落位动画用的全屏画布 -->
<canvas id="handoff" aria-hidden="true"></canvas>

<!-- 封面 -->
<section class="screen on" id="s-intro">
  <div class="cover-head" id="cover-head">
    <div class="kicker">Mood · Flowers</div>
    <h1 class="px"></h1>
  </div>
</section>

<!-- 答题 -->
<section class="screen" id="s-quiz">
  <div class="inner">
    <div class="quizbox">
      <div class="qbar">
        <span><b id="qnow">01</b> / <span id="qtotal">07</span></span>
        <span id="qlabel"></span>
      </div>
      <div class="prog"><i id="progbar"></i></div>
      <div class="qwrap" id="qwrap" aria-live="polite">
        <p class="qtext" id="qtext"></p>
        <div class="opts" id="opts"></div>
      </div>
      <button class="back" id="back" type="button" disabled>← 上一题</button>
    </div>
  </div>
</section>

<!-- 过渡 -->
<section class="screen" id="s-loading">
  <div class="inner">
    <div class="waiting">
      <p>今天的你适合<span class="dots"><i></i><i></i><i></i></span></p>
    </div>
  </div>
</section>

<!-- 花笺 -->
<section class="screen" id="s-result">
  <div class="inner"><div class="card" id="card"></div></div>
</section>

<script>
/* ===========================================================
   像素花谱 · 十五种
   画法约定（沿用鹤望兰那一版）：
   · 只用纯色块，硬边，一块 1px；
   · 每片花瓣最多两三层明暗，不描边；
   · 花头占画幅主体，茎叶只做交代；
   · 一切运动都是整数位移，不做插值。
   =========================================================== */
(function (root) {
  var D2R = Math.PI / 180;

  /* ---------- 画笔 ---------- */
  function P(ctx) {
    function px(x, y, w, h, c) {
      x = Math.round(x); y = Math.round(y);
      w = Math.round(w); h = Math.round(h);
      if (w < 1) w = 1;
      if (h < 1) h = 1;
      ctx.fillStyle = c;
      ctx.fillRect(x, y, w, h);
    }
    function disc(cx, cy, r, c) {
      cx = Math.round(cx); cy = Math.round(cy);
      var lim = r * r + r * 0.55;
      for (var y = -r; y <= r; y++) {
        for (var x = -r; x <= r; x++) {
          if (x * x + y * y <= lim) { ctx.fillStyle = c; ctx.fillRect(cx + x, cy + y, 1, 1); }
        }
      }
    }
    function curve(x0, y0, cx, cy, x1, y1, w, c) {
      ctx.fillStyle = c;
      for (var i = 0; i <= 64; i++) {
        var t = i / 64, mt = 1 - t;
        var x = mt * mt * x0 + 2 * mt * t * cx + t * t * x1;
        var y = mt * mt * y0 + 2 * mt * t * cy + t * t * y1;
        ctx.fillRect(Math.round(x), Math.round(y), w, 1);
      }
    }
    /* 尖头楔形：根部最宽，尖端收到 0 */
    function blade(x0, y0, ang, L, w0, w1, c) {
      var ca = Math.cos(ang), sa = Math.sin(ang);
      var n = Math.max(2, Math.floor(L * 1.4));
      ctx.fillStyle = c;
      for (var i = 0; i <= n; i++) {
        var t = i / n, w = w0 + (w1 - w0) * t;
        var x = x0 + ca * (t * L), y = y0 + sa * (t * L);
        var half = w / 2, nx = -sa, ny = ca;
        var x1 = x + nx * half, y1 = y + ny * half;
        var x2 = x - nx * half, y2 = y - ny * half;
        ctx.fillRect(Math.round(Math.min(x1, x2)), Math.round(Math.min(y1, y2)),
          Math.max(1, Math.round(Math.abs(x1 - x2))), Math.max(1, Math.round(Math.abs(y1 - y2))));
      }
    }
    /* 圆头花瓣：两头收，中间最宽 */
    function petal(x0, y0, ang, L, wMax, c) {
      var ca = Math.cos(ang), sa = Math.sin(ang);
      var n = Math.max(3, Math.floor(L * 1.8));
      ctx.fillStyle = c;
      for (var i = 0; i <= n; i++) {
        var t = i / n;
        var w = wMax * Math.sin(Math.PI * Math.pow(t, 0.72));
        if (w < 0.7) continue;
        var x = x0 + ca * (t * L), y = y0 + sa * (t * L);
        var half = w / 2, nx = -sa, ny = ca;
        var x1 = x + nx * half, y1 = y + ny * half;
        var x2 = x - nx * half, y2 = y - ny * half;
        ctx.fillRect(Math.round(Math.min(x1, x2)), Math.round(Math.min(y1, y2)),
          Math.max(1, Math.round(Math.abs(x1 - x2))), Math.max(1, Math.round(Math.abs(y1 - y2))));
      }
    }
    /* 圆弧：a0→a1（度），按半径画一圈点，厚 th */
    function arc(cx, cy, r, a0, a1, th, c) {
      var steps = Math.max(8, Math.round(Math.abs(a1 - a0) * r / 40));
      ctx.fillStyle = c;
      for (var i = 0; i <= steps; i++) {
        var a = (a0 + (a1 - a0) * (i / steps)) * Math.PI / 180;
        var x = Math.round(cx + Math.cos(a) * r);
        var y = Math.round(cy + Math.sin(a) * r);
        ctx.fillRect(x, y, Math.max(1, th), Math.max(1, th));
      }
    }
    return { px: px, disc: disc, curve: curve, blade: blade, petal: petal, arc: arc };
  }

  /* 呼吸与颤动，全花共用一套节奏 */
  function anim(t) {
    return {
      b: 1 + Math.sin(t * 1.1) * 0.045,
      r: Math.sin(t * 0.85 + 1.7) > 0.55 ? 1 : 0,
      s: Math.sin(t * 0.9 + 0.4) > 0.7 ? 1 : 0
    };
  }

  /* 一圈花瓣 */
  function ring(p, cx, cy, n, L, wMax, c, rot) {
    rot = rot || 0;
    for (var i = 0; i < n; i++) {
      p.petal(cx, cy, (rot + i * 360 / n) * D2R, L, wMax, c);
    }
  }

  /* ---------- 01 洋甘菊 ---------- */
  function chamomile(ctx, t) {
    var p = P(ctx), a = anim(t);
    var G1 = '#4C7544', G2 = '#6E9C5C';
    p.curve(31, 64, 28, 52, 31, 34, 2, G1);
    p.curve(31, 64, 28, 52, 31, 34, 1, G2);
    /* 羽状细叶，三对 */
    [[54, -150], [50, -32], [58, -160], [57, -26], [62, -146], [62, -36]].forEach(function (q, i) {
      p.blade(31, q[0], q[1] * D2R, i < 2 ? 9 : 6, 3, 1, i % 2 ? G1 : G2);
    });
    /* 花瓣：先一层暗的垫底，再一层亮的，出厚度 */
    ring(p, 31, 26, 10, 12.5 * a.b, 5.4, '#E3DAC0');
    ring(p, 31, 26, 10, 11.2 * a.b, 4.4, '#F8F4E6', 18);
    p.disc(31, 26, 4, '#F2C13C');
    p.disc(31, 26, 2, '#D89A24');
    p.px(30, 25, 1, 1, '#FBDF8A');
  }

  /* ---------- 02 铃兰 ---------- */
  function lily(ctx, t) {
    var p = P(ctx), a = anim(t);
    var G1 = '#5E8250', G2 = '#7BA066';
    /* 两片基生叶 */
    p.blade(24, 64, -104 * D2R, 40, 11, 3, G1);
    p.blade(24, 64, -88 * D2R, 34, 4, 1, G2);
    p.blade(27, 64, -66 * D2R, 30, 9, 2, G1);
    /* 花葶越过头顶，向右弯 */
    p.curve(26, 60, 26, 30, 47, 21, 2, G1);
    /* 铃铛：沿花葶右下方一列 */
    var bells = [[28, 40, 3], [33, 34, 3], [39, 29, 3], [45, 25, 2]];
    bells.forEach(function (q, i) {
      var bx = q[0], by = q[1] + Math.round(a.r * (i % 2 ? 1 : 0));
      p.px(bx, by - 2, 1, 2, G1);
      p.disc(bx, by + 1, q[2], '#F5F8EE');
      p.px(bx - q[2], by + q[2], q[2] * 2 + 1, 1, '#DDE4D3');
      p.px(bx - 1, by + 1, 1, 1, '#CBD5C0');
    });
    /* 顶端的小花苞 */
    p.disc(48, 19, 1, '#EDF2E4');
  }

  /* ---------- 03 蓝星花 ---------- */
  function bluestar(ctx, t) {
    var p = P(ctx), a = anim(t);
    var G = '#4C7544';
    p.curve(32, 64, 30, 48, 32, 38, 2, G);
    p.blade(32, 54, -158 * D2R, 9, 3, 1, G);
    p.blade(32, 50, -24 * D2R, 8, 3, 1, G);
    /* 主花：五瓣星 */
    ring(p, 32, 28, 5, 11 * a.b, 6, '#7FAEDD', -90);
    ring(p, 32, 28, 5, 10 * a.b, 4.6, '#9CC3EA', -54);
    p.disc(32, 28, 2, '#EAF3FC');
    /* 副花 */
    p.curve(32, 44, 24, 44, 18, 41, 1, G);
    ring(p, 18, 40, 5, 6.5 * a.b, 3.6, '#9CC3EA', -90);
    p.disc(18, 40, 1, '#EAF3FC');
  }

  /* ---------- 04 紫阳花 ---------- */
  function hydrangea(ctx, t) {
    var p = P(ctx), a = anim(t);
    var G1 = '#3F6236', G2 = '#547D46';
    p.curve(32, 64, 32, 48, 32, 40, 3, G1);
    p.petal(32, 58, -168 * D2R, 17, 13, G1);
    p.petal(32, 60, -12 * D2R, 16, 12, G1);
    p.petal(32, 58, -168 * D2R, 13, 4, G2);
    p.petal(32, 60, -12 * D2R, 12, 4, G2);

    /* 花球：按同心圆排满，挤成一团才像绣球，散着放就成了贴片 */
    var pts = [[32, 22]];
    var r1 = 6, r2 = 12;
    for (var i = 0; i < 5; i++) {
      pts.push([32 + Math.cos(i * 72 * D2R) * r1, 24 + Math.sin(i * 72 * D2R) * r1]);
    }
    for (var j = 0; j < 9; j++) {
      var ang = (j / 9) * 360 + 20;
      pts.push([32 + Math.cos(ang * D2R) * r2, 24 + Math.sin(ang * D2R) * r2 * 0.92]);
    }
    pts.push([32, 36]);

    pts.forEach(function (q) {
      var y = q[1];
      var c = y < 18 ? '#CBB9E8' : (y < 26 ? '#B29CDA' : (y < 32 ? '#9C84C9' : '#8A70BA'));
      ring(p, q[0], q[1], 4, 4.6 * a.b, 4.2, c, 45);
      p.px(q[0], q[1], 1, 1, '#F2ECFB');
    });
  }

  /* ---------- 05 风信子 ---------- */
  function hyacinth(ctx, t) {
    var p = P(ctx), a = anim(t);
    var G1 = '#4C6D42', G2 = '#688F55';
    p.blade(30, 64, -110 * D2R, 34, 7, 2, G1);
    p.blade(34, 64, -70 * D2R, 32, 7, 2, G1);
    p.blade(32, 64, -92 * D2R, 26, 3, 1, G2);
    p.curve(32, 64, 32, 48, 32, 38, 3, '#5E8250');
    /* 花穗：上小下大，一列小星花 */
    for (var i = 0; i < 8; i++) {
      var y = 42 - i * 3.4;
      var dx = (i % 2 ? 2 : -2) * (1 - i / 10);
      var L = (4.4 - i * 0.32) * a.b;
      var c = i < 3 ? '#C7B2DE' : (i < 6 ? '#A98CC8' : '#8E6FB0');
      ring(p, 32 + dx, y, 4, L, 3.2, c, 45 + i * 10);
      p.px(32 + dx, y, 1, 1, '#E4D9F2');
    }
    p.disc(32, 54, 2, '#5E8250');
  }

  /* ---------- 06 勿忘我 ---------- */
  function forget(ctx, t) {
    var p = P(ctx), a = anim(t);
    var G = '#4C7544', B1 = '#6C9BD2', B2 = '#8AB2E2';
    p.curve(30, 64, 27, 48, 30, 36, 2, G);
    p.curve(30, 48, 24, 44, 19, 39, 1, G);
    p.curve(30, 52, 37, 48, 42, 43, 1, G);
    p.blade(30, 57, -150 * D2R, 8, 3, 1, G);
    var fs = [[30, 32, 4.8], [19, 37, 3.8], [42, 41, 3.6]];
    fs.forEach(function (q, i) {
      ring(p, q[0], q[1], 5, q[2] * 1.9 * a.b, q[2] * 1.05, i ? B2 : B1, -90 + i * 12);
      p.px(q[0], q[1], 1, 1, '#F3D75F');
    });
  }

  /* ---------- 07 三色堇 ---------- */
  /* 名字里就写着「三色」，那就画三朵，三种最常见的花色：
     紫黄（最经典的那一色）、白紫、黄褐。一株多花，本来就长这样。 */
  function pansy(ctx, t) {
    var p = P(ctx), a = anim(t);
    var G = '#43683C', G2 = '#5C8A4E';

    /* 主茎与两条侧枝 */
    p.curve(32, 64, 31, 56, 32, 44, 2, G);
    p.curve(32, 53, 25, 48, 19, 43, 1, G2);
    p.curve(32, 50, 40, 45, 47, 39, 1, G2);
    /* 基部两片圆叶 */
    p.petal(31, 61, -168 * D2R, 11, 8, G);
    p.petal(33, 62, -12 * D2R, 10, 8, G);
    p.petal(31, 61, -168 * D2R, 8, 3, G2);
    p.petal(33, 62, -12 * D2R, 7, 3, G2);

    /* 五瓣一张脸：上两瓣、侧两瓣、下一瓣。瓣是圆的，尖了就成星芒。
       花心一块明黄，下瓣压两道深纹——三色堇的「脸」全在这两处。 */
    function face(cx, cy, s, c) {
      var L = 9.4 * s * a.b, w = 8.8 * s;
      p.petal(cx, cy, -110 * D2R, L, w, c.up);
      p.petal(cx, cy, -70 * D2R, L, w, c.up);
      p.petal(cx - s, cy + s, 170 * D2R, L * 0.94, w, c.side);
      p.petal(cx + s, cy + s, 10 * D2R, L * 0.94, w, c.side);
      p.petal(cx, cy + 2 * s, 90 * D2R, L * 0.82, w * 1.28, c.down);
      p.disc(cx, cy - s, Math.max(1, Math.round(2.4 * s)), c.eye);
      p.disc(cx, cy - s, Math.max(1, Math.round(0.9 * s)), c.eyecore);
      p.px(cx - 2.6 * s, cy + 3.2 * s, Math.max(2, Math.round(4.6 * s)), 1, c.blotch);
      p.px(cx - 1.8 * s, cy + 4.3 * s, Math.max(2, Math.round(3.4 * s)), 1, c.blotch);
      /* 花萼：盖住花瓣与花梗的接缝 */
      p.px(cx - s, cy + L * 0.80, Math.max(2, Math.round(2.4 * s)), 1, G);
    }

    /* 一 · 紫黄：上紫下黄，最认得出来的一色 */
    face(33, 21, 1, {
      up: '#6B4FA0', side: '#7E62B0', down: '#EFCF6A',
      eye: '#EFCF6A', eyecore: '#C08F2E', blotch: '#43306B'
    });
    /* 二 · 白紫：白瓣带紫晕，花心一点明黄 */
    face(16, 37, 0.76, {
      up: '#DCD0EF', side: '#F2ECFA', down: '#FDFAFF',
      eye: '#EFCB55', eyecore: '#C49A2A', blotch: '#8A72BE'
    });
    /* 三 · 黄褐：暖黄瓣，花心压深褐，远看是一片金 */
    face(48, 34, 0.82, {
      up: '#E8B93C', side: '#F3D067', down: '#FBE7A4',
      eye: '#B4762C', eyecore: '#7A4519', blotch: '#7A4519'
    });
  }

  /* ---------- 08 樱花 ---------- */
  function sakura(ctx, t) {
    var p = P(ctx), a = anim(t);
    var W = '#6B4A3A', W2 = '#8A624D', P1 = '#F8D8E2', P2 = '#FCEEF2', C1 = '#E89DB2';
    p.curve(6, 58, 24, 50, 46, 30, 2, W);
    p.curve(26, 46, 34, 34, 40, 23, 2, W);
    p.curve(6, 58, 24, 50, 46, 30, 1, W2);
    function blossom(cx, cy, s) {
      var L = 8.2 * s * a.b, w = 7.8 * s;
      for (var i = 0; i < 5; i++) {
        var ang = (-90 + i * 72) * D2R;
        /* 每瓣由两片窄的合成，尖端自然裂开一道口，那是樱花的记号 */
        p.petal(cx, cy, ang - 7 * D2R, L, w * 0.68, P1);
        p.petal(cx, cy, ang + 7 * D2R, L, w * 0.68, P1);
        p.petal(cx, cy, ang, L * 0.62, w * 0.62, P2);
      }
      p.disc(cx, cy, 1, C1);
      p.px(cx - 2, cy - 2, 1, 1, C1);
      p.px(cx + 2, cy - 2, 1, 1, C1);
      p.px(cx, cy - 3, 1, 1, C1);
    }
    blossom(23, 41, 1);
    blossom(40, 28, 0.92);
    blossom(49, 45, 0.62);
    /* 两枚还没开的花苞 */
    p.disc(12, 48, 1, P1);
    p.disc(33, 19, 1, P1);
  }

  /* ---------- 09 蔷薇 ---------- */
  function rose(ctx, t) {
    var p = P(ctx), a = anim(t);
    var G = '#4C6D42', G2 = '#688F55';
    p.curve(32, 64, 30, 52, 32, 42, 2, G);
    p.blade(31, 56, -156 * D2R, 10, 5, 2, G);
    p.blade(33, 60, -24 * D2R, 9, 5, 2, G);
    p.blade(31, 56, -156 * D2R, 8, 2, 1, G2);
    p.px(30, 50, 1, 1, '#8FA37F');
    p.px(33, 46, 1, 1, '#8FA37F');

    var cx = 32, cy = 28, R = 11 * a.b;
    /* 底：整朵的暗红，先把体积垫出来 */
    p.disc(cx, cy, Math.round(R), '#8E2833');
    /* 外圈六瓣，只露出边缘一点，形才不是个圆饼 */
    for (var i = 0; i < 6; i++) {
      p.petal(cx, cy, (-90 + i * 60) * D2R, R + 1.5, 11, '#A8323E');
    }
    /* 花心：三段 C 形弧线，玫瑰的卷心全在这几道螺旋里 */
    p.arc(cx, cy, R - 2, 150, 350, 2, '#C2454F');
    p.arc(cx, cy, R - 5, -10, 190, 2, '#D05C66');
    p.arc(cx, cy, R - 7.5, 200, 380, 1, '#DE7B84');
    p.arc(cx, cy, 2.5, 20, 300, 1, '#F0A0A6');
    p.disc(cx, cy, 1, '#8E2833');
  }

  /* ---------- 10 桔梗 ---------- */
  function platycodon(ctx, t) {
    var p = P(ctx), a = anim(t);
    var G = '#4C7544', V1 = '#7B6FB8', V2 = '#9689CF', V3 = '#5B4F94';
    p.curve(32, 64, 31, 50, 32, 41, 2, G);
    p.blade(32, 56, -154 * D2R, 9, 4, 1, G);
    p.blade(32, 52, -26 * D2R, 8, 4, 1, G);
    /* 未开的球状花苞，桔梗的名字就来自它 */
    p.curve(32, 50, 40, 48, 44, 45, 1, G);
    p.disc(47, 42, 4, '#B8ADE0');
    p.disc(46, 40, 2, '#D2CBEA');
    p.px(44, 45, 6, 1, G);
    var cx = 32, cy = 31;
    /* 五枚瓣：根宽、腰略收、尖头，拼成五角星而不是尖刺 */
    for (var i = 0; i < 5; i++) {
      var ang = (-90 + i * 72) * D2R;
      p.petal(cx, cy, ang, 12 * a.b, 11, V1);
      p.blade(cx + Math.cos(ang) * 8, cy + Math.sin(ang) * 8, ang, 6 * a.b, 4, 0.6, V1);
      p.petal(cx, cy, ang, 8 * a.b, 6, V2);
    }
    p.disc(cx, cy, 3, '#E6E1F2');
    p.disc(cx, cy, 1, V3);
  }

  /* ---------- 11 香豌豆 ---------- */
  function sweetpea(ctx, t) {
    var p = P(ctx), a = anim(t);
    var G = '#4C7544', G2 = '#7BA066';
    p.curve(30, 64, 25, 50, 32, 42, 2, G);
    p.blade(28, 58, -150 * D2R, 10, 4, 1, G);
    p.curve(32, 42, 33, 39, 34, 36, 2, G2);
    /* 卷须 */
    [[33, 33], [31, 30], [27, 27], [24, 27], [22, 29]].forEach(function (q) {
      p.px(q[0], q[1], 1, 1, G2);
    });
    var cx = 34, cy = 33;
    /* 花瓣在根部都收成零，得先垫个实心花心，否则中间是个洞 */
    p.disc(cx, cy + 1, 3, '#E9A2C0');
    /* 旗瓣：一片大圆瓣立在最上 */
    p.petal(cx, cy + 2, -84 * D2R, 13 * a.b, 12, '#E9A2C0');
    p.petal(cx, cy, -84 * D2R, 10 * a.b, 6, '#F8D6E2');
    /* 两翼向两侧张开，压在旗瓣根部 */
    p.petal(cx - 3, cy + 3, 166 * D2R, 10 * a.b, 9, '#F2BBD0');
    p.petal(cx + 3, cy + 3, 14 * D2R, 10 * a.b, 9, '#F2BBD0');
    /* 龙骨：中间一小片 */
    p.petal(cx, cy + 4, 90 * D2R, 7 * a.b, 6, '#C3A8DC');
    /* 花萼 */
    p.px(cx - 1, cy + 7, 3, 1, G2);
  }

  /* ---------- 12 鹤望兰 ---------- */
  function strelitzia(ctx, t) {
    var p = P(ctx), a = anim(t);
    var b = 1 + Math.sin(t * 1.15) * 0.055;
    var r = a.r;
    /* 花茎与叶：保留原绿，只压暗一档，让红更跳 */
    p.curve(26, 64, 27, 54, 32, 43, 3, "#3C6234");
    p.curve(25, 64, 26, 54, 31, 43, 1, "#568245");

    p.blade(28, 57, (-155 + r) * D2R, 19, 9, 2, "#375F33");
    p.blade(28, 56, (-155 + r) * D2R, 16, 3, 1, "#558547");
    p.blade(29, 55, (46 - r) * D2R, 11, 7, 2, "#375F33");
    p.blade(29, 54, (46 - r) * D2R, 10, 3, 1, "#558547");

    /* 花心 */
    for (var yy = -3; yy <= 3; yy++) {
      for (var xx = -3; xx <= 3; xx++) {
        if (xx * xx + yy * yy <= 9) p.px(32 + xx, 41 + yy, 1, 1, "#8C1F26");
      }
    }

    /* 五枚萼片：由深到浅的朱红 */
    var fan = [
      [-118, 16, "#8C1F26"],
      [-100, 20, "#A82A2E"],
      [-80, 21, "#C0342F"],
      [-60, 18, "#D6554A"],
      [-40, 15, "#C0342F"]
    ];
    for (var i = 0; i < fan.length; i++) {
      p.blade(32, 40, fan[i][0] * D2R, fan[i][1] * b, 6, 2, fan[i][2]);
    }
    for (var j = 0; j < fan.length; j++) {
      p.blade(31, 39, fan[j][0] * D2R, (fan[j][1] - 5) * b, 2, 1, "#E3857A");
    }

    /* 佛焰苞（鸟喙）：白，暗部走暖灰 */
    p.blade(32, 44, -18 * D2R, 17, 2, 1, "#A29B8D");
    p.blade(32, 41, -20 * D2R, 20, 7, 2, "#E3DDCE");
    p.blade(32, 40, -20 * D2R, 14, 2, 1, "#FFFBF0");

    p.blade(34, 44, 60 * D2R, 5, 3, 1, "#D9A29A");
    p.px(30, 39, 2, 2, "#FFF7EA");
  }

  /* ---------- 13 飞燕草 ---------- */
  function delphinium(ctx, t) {
    var p = P(ctx), a = anim(t);
    var G = '#4C7544', B1 = '#5B7FC4', B2 = '#7E9CD8', B3 = '#9DB3E4';
    p.curve(32, 64, 32, 46, 32, 22, 2, G);
    /* 掌状裂叶 */
    [-150, -118, -62, -30].forEach(function (d, i) {
      p.blade(32, 60, d * D2R, i % 2 ? 14 : 17, 5, 1, G);
    });
    p.blade(32, 56, -90 * D2R, 12, 3, 1, '#688F55');
    /* 花穗：下大上小，每朵带一根距 */
    for (var i = 0; i < 6; i++) {
      var y = 44 - i * 4.4;
      var L = (5.4 - i * 0.42) * a.b;
      var dx = (i % 2 ? 3 : -3) * (1 - i / 9);
      p.blade(32 + dx, y + 1, -150 * D2R, L, 2, 1, B1);  /* 距 */
      p.blade(32 + dx, y + 1, -30 * D2R, L, 2, 1, B1);
      ring(p, 32 + dx, y, 4, L, 3.6, i < 2 ? B3 : (i < 4 ? B2 : B1), 45);
      p.px(32 + dx, y, 1, 1, '#DCE6F7');
    }
    p.disc(32, 8, 1, B3);
  }

  /* ---------- 14 向日葵 ---------- */
  function sunflower(ctx, t) {
    var p = P(ctx), a = anim(t);
    var G1 = '#3F6236', G2 = '#577E45', Y1 = '#F2C230', Y2 = '#E0A81F';
    p.curve(32, 64, 30, 52, 32, 40, 3, G1);
    p.blade(31, 54, -158 * D2R, 15, 9, 3, G1);
    p.blade(31, 54, -158 * D2R, 12, 3, 1, G2);
    p.blade(34, 58, -22 * D2R, 13, 8, 3, G1);
    p.blade(34, 58, -22 * D2R, 10, 3, 1, G2);
    var cx = 32, cy = 28;
    /* 舌状花：两圈，外圈深一档 */
    ring(p, cx, cy, 14, 11 * a.b, 6.4, Y2);
    ring(p, cx, cy, 14, 9.4 * a.b, 5.2, Y1, 360 / 28);
    /* 花盘 */
    p.disc(cx, cy, 7, '#6B4A2A');
    p.disc(cx, cy, 5, '#5A3D22');
    for (var y = -5; y <= 5; y += 2) {
      for (var x = -5; x <= 5; x += 2) {
        if (x * x + y * y <= 26) p.px(cx + x, cy + y, 1, 1, '#8A6238');
      }
    }
    p.disc(cx, cy, 2, '#3E2A18');
  }

  /* ---------- 15 波斯菊 ---------- */
  function cosmos(ctx, t) {
    var p = P(ctx), a = anim(t);
    var G = '#4C7544', G2 = '#688F55';
    p.curve(32, 64, 30, 48, 32, 36, 1, G);
    /* 羽状细叶 */
    [[56, -156], [56, -24], [61, -150], [61, -30], [66, -158], [66, -22]].forEach(function (q, i) {
      p.blade(32, q[0], q[1] * D2R, 10, 2, 1, i % 2 ? G : G2);
    });
    ring(p, 32, 28, 8, 13 * a.b, 7.4, '#D06C96');
    ring(p, 32, 28, 8, 11.6 * a.b, 6.2, '#E58BB0', 22.5);
    /* 花瓣上的浅纹 */
    for (var i = 0; i < 8; i++) {
      p.petal(32, 28, (i * 45 + 22.5) * D2R, 10 * a.b, 2.2, '#F2AEC8');
    }
    p.disc(32, 28, 3, '#E6B33C');
    p.disc(32, 28, 1, '#C99A24');
  }

  root.FLOWERS = {

    bluestar:  { no: '03', name: '蓝星花', en: 'Blue Star', latin: 'Oxypetalum', huayu: '互信的心 · 把握现在', draw: bluestar },
    hydrangea: { no: '04', name: '紫阳花', en: 'Hydrangea', latin: 'Hydrangea', huayu: '希望 · 善变', draw: hydrangea },
    hyacinth:  { no: '05', name: '风信子', en: 'Hyacinth', latin: 'Hyacinthus', huayu: '重生之爱', draw: hyacinth },
    forget:    { no: '06', name: '勿忘我', en: 'Forget-me-not', latin: 'Myosotis', huayu: '请不要忘记我', draw: forget },
    pansy:     { no: '07', name: '三色堇', en: 'Pansy', latin: 'Viola', huayu: '请思念我 · 沉思', draw: pansy },
    sakura:    { no: '08', name: '樱花',   en: 'Cherry Blossom', latin: 'Prunus', huayu: '对你微笑 · 等你回来', draw: sakura },
    rose:      { no: '09', name: '蔷薇',   en: 'Rose', latin: 'Rosa', huayu: '爱的思念 · 爱与美', draw: rose },
    platycodon:{ no: '10', name: '桔梗',   en: 'Balloon Flower', latin: 'Platycodon', huayu: '永恒的爱 · 无望的爱', draw: platycodon },
    sweetpea:  { no: '11', name: '香豌豆', en: 'Sweet Pea', latin: 'Lathyrus', huayu: '片刻的喜悦', draw: sweetpea },
    strelitzia:{ no: '12', name: '鹤望兰', en: 'Bird of Paradise', latin: 'Strelitzia', huayu: '自由 · 用心去爱', draw: strelitzia },
    delphinium:{ no: '13', name: '飞燕草', en: 'Larkspur', latin: 'Delphinium', huayu: '自由 · 美丽轻盈', draw: delphinium },
    sunflower: { no: '14', name: '向日葵', en: 'Sunflower', latin: 'Helianthus', huayu: '爱慕 · 沉默的爱', draw: sunflower },
    cosmos:    { no: '15', name: '波斯菊', en: 'Cosmos', latin: 'Cosmos', huayu: '少女的真心 · 自由', draw: cosmos }
  };

  root.FLOWER_PALETTE = {
    bg: '#0D1211',
    ink: '#F2EBDF',
    dim: '#8B968F',
    accent: '#C9534A',
    pollen: 'rgba(240,226,208,'
  };

  /* 花粉：十五朵共用，标题页的主线 */
  root.makePollen = function (n, w, h) {

      arr.push({

  };

  var ANCHORS = {

  });

  /* 并列时谁优先：先看温柔和想念，再看明亮，最后才看累 */
  var ORDER = ['warm', 'yearn', 'bright', 'endure', 'drift', 'escape'];

  function analyze(answers) {
    var raw = {};
    DIMS.forEach(function (d) { raw[d] = 0; });

    answers.forEach(function (oi, qi) {
      var opt = QUESTIONS[qi] && QUESTIONS[qi].opts[oi];
      if (!opt) return;
      for (var k in opt.w) raw[k] += opt.w[k];
    });

    /* 归一化：不同的维度被问到的次数不一样，不折算的话「想念」永远输 */
    var prof = {};
    DIMS.forEach(function (d) { prof[d] = MAX[d] ? raw[d] / MAX[d] : 0; });

    var top = null;
    ORDER.forEach(function (d) {
      if (top === null || prof[d] > prof[top] + 1e-9) top = d;

      id: pick,
      dim: ANCHORS[pick].c,
      cluster: CLUSTER_NAME[ANCHORS[pick].c],
      profile: prof,
      raw: raw,
      fit: pickScore

  root.moodAnalyze = analyze;

(function () {

  /* ---------------------------------------------------------
     像素字：小字号栅格化 → 二值化 → 整数倍放大
     --------------------------------------------------------- */
  function pixelTitle(host, text, opt) {
    opt = opt || {};
    var BASE = opt.base || 28, SCALE = opt.scale || 2, GAP = opt.gap || 5, TH = opt.th || 120;
    var ink = (opt.ink || '#F2EBDF').replace('#', '');
    var cr = parseInt(ink.substr(0, 2), 16),
        cg = parseInt(ink.substr(2, 2), 16),
        cb = parseInt(ink.substr(4, 2), 16);

    var probe = document.createElement('canvas').getContext('2d');
    probe.font = '700 ' + BASE + 'px "Microsoft YaHei","微软雅黑","SimHei","黑体",sans-serif';

    var chars = text.split('');
    var widths = chars.map(function (ch) { return Math.ceil(probe.measureText(ch).width); });
    var W = widths.reduce(function (a, b) { return a + b; }, 0) + GAP * (chars.length - 1);
    var H = BASE + 14;

    var off = document.createElement('canvas');
    off.width = W; off.height = H;
    var o = off.getContext('2d');
    o.font = probe.font;
    o.textBaseline = 'top';
    o.fillStyle = '#FFFFFF';
    var x = 0;
    chars.forEach(function (ch, i) { o.fillText(ch, x, 4); x += widths[i] + GAP; });

    var img;
    try { img = o.getImageData(0, 0, W, H); } catch (e) { return; }

    var d = img.data, minX = W, minY = H, maxX = -1, maxY = -1;
    for (var i = 0; i < d.length; i += 4) {
      if (d[i + 3] >= TH) {
        var p = i / 4, px = p % W, py = (p / W) | 0;
        if (px < minX) minX = px;
        if (px > maxX) maxX = px;
        if (py < minY) minY = py;
        if (py > maxY) maxY = py;
        d[i] = cr; d[i + 1] = cg; d[i + 2] = cb; d[i + 3] = 255;
      } else {
        d[i + 3] = 0;
      }
    }

    var cw = maxX - minX + 1, chh = maxY - minY + 1;
    var out = document.createElement('canvas');
    out.width = cw; out.height = chh;
    out.getContext('2d').putImageData(img, -minX, -minY);
    out.style.width = (cw * SCALE) + 'px';
    out.style.height = (chh * SCALE) + 'px';

    if (head) head.classList.add('out');

    ambEl = ambEl || document.getElementById('ambient');
    if (ambEl) ambEl.classList.add('core-off');

    if (reduce || !ambEl) {
      start();
      busy = false;
      return;
    }

    ambEl.style.transition = 'none';

    tweenAmbient(0.03, 1, 460, easeInCubic, function () {
      tweenAmbient(2.9, 0, 620, easeOutCubic, function () {
        ambEl.classList.add('dim');
        ambEl.classList.remove('off');
        start();
        ambEl.style.transform = 'translate(-50%,-50%) scale(2.9)';
        ambEl.style.opacity = '0';

        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            tweenAmbient(1, 0.95, 900, easeOutCubic, function () {
              ambEl.style.transition = '';
              ambEl.style.transform = '';
              ambEl.style.opacity = '';
              busy = false;
            });
          });
        });
      });
    }, 0.35);
  }

  /* ---------------------------------------------------------
     花笺
     --------------------------------------------------------- */
  var live = null;   /* { ctx, draw, pollen } */

  function stripEnd(s) { return s.replace(/[。，、]$/, ''); }

  function buildResultCard(hold) {
    var r = window.moodAnalyze(state.answers);
    var f = window.FLOWERS[r.id];
    var words = window.FLOWER_WORDS[r.id] || [];
    var q1 = stripEnd(QS[0].opts[state.answers[0]].t);

    try { sessionStorage.setItem(ANSWERS_KEY, JSON.stringify(state.answers)); } catch (e) {}

    var card = $('#card');
    card.innerHTML =
      '<div class="eyebrow rv" style="animation-delay:.05s">' + f.latin + '</div>' +
      '<div class="stage rv" style="animation-delay:.15s">' +
        '<canvas width="64" height="64" aria-label="' + f.name + '像素画"></canvas>' +
      '</div>' +
      '<h1 class="px rv" style="animation-delay:.28s"></h1>' +
      '<div class="huayu rv" style="animation-delay:.34s">' + f.huayu + '</div>' +
      '<div class="echo rv" style="animation-delay:.4s">你说，今天醒来是「' + q1 + '」。</div>' +
      '<div class="rule rv" style="animation-delay:.46s"></div>' +
      '<div class="words rv" style="animation-delay:.52s">' +
        words.map(function (p) { return '<p>' + p + '</p>'; }).join('') +
      '</div>' +
      '<div class="acts rv" style="animation-delay:.7s">' +
        '<button type="button" id="again">再答一次</button>' +
        '<a href="flowers.html">看完整花谱</a>' +
      '</div>';

    pixelTitle($('#card h1'), f.name, { base: 28, scale: 2, gap: 5 });

    var cv = card.querySelector('.stage canvas');
    var ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    live = { ctx: ctx, draw: f.draw, pollen: window.makePollen(11, 64, 64), ph: 0 };

    $('#again').addEventListener('click', function () {
      live = null;
      start();
    });

    if (!hold) return { f: f, id: r.id, rect: null };

    /* 把入场动画压平，量出结果页那朵花最终的位置，再让动画自己跑 */
    card.classList.add('no-rv');
    var stage = card.querySelector('.stage');
    stage.classList.add('hold');
    var rect = cv.getBoundingClientRect();
    card.classList.remove('no-rv');

    return { f: f, id: r.id, rect: rect };
  }

  function revealResult() {
    go('result');
    document.getElementById('s-result').scrollTop = 0;
  }

  function showResult() {
    buildResultCard(false);
    revealResult();
  }

  /* ---------------------------------------------------------
     封面：十五朵花在平面上绕圈，中心是一团绕着开始键的光粒
     --------------------------------------------------------- */
  var orbit = null;
  var orbitTimer = null;
  var PALETTE = MOODS.map(function (m) { return m.color; });
  var PALETTE_RGB = PALETTE.map(function (hex) {
    var n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  });
  var DIM_ORDER = ['endure', 'drift', 'yearn', 'warm', 'escape', 'bright'];

  var ambEl = null;
  var ambState = { scale: 1, opacity: 1 };
  var ambientTween = null;

  function rgbaRgb(rgb, a) {
    return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')';
  }

  function mixRgb(a, b, t) {
    return [
      Math.round(a[0] + (b[0] - a[0]) * t),
      Math.round(a[1] + (b[1] - a[1]) * t),
      Math.round(a[2] + (b[2] - a[2]) * t)
    ];
  }

  function easeInCubic(t) { return t * t * t; }
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function tweenAmbient(toScale, toOpacity, dur, ease, done, fadeFrom) {
    ambientTween = {
      fromScale: ambState.scale,
      toScale: toScale,
      fromOpacity: ambState.opacity,
      toOpacity: toOpacity,
      start: performance.now(),
      dur: dur,
      ease: ease,
      fadeFrom: fadeFrom || 0,
      done: done
    };
  }

  function stepAmbient(now) {
    var tw = ambientTween;
    if (!tw) return;
    var p = Math.min(1, (now - tw.start) / tw.dur);
    var e = tw.ease(p);
    var fp = tw.fadeFrom > 0
      ? Math.max(0, (p - tw.fadeFrom) / (1 - tw.fadeFrom))
      : p;
    ambState.scale = tw.fromScale + (tw.toScale - tw.fromScale) * e;
    ambState.opacity = tw.fromOpacity + (tw.toOpacity - tw.fromOpacity) * fp;
    if (ambEl) {
      ambEl.style.transform = 'translate(-50%,-50%) scale(' + ambState.scale + ')';
      ambEl.style.opacity = ambState.opacity;
    }
    if (p >= 1) {
      ambientTween = null;
      if (tw.done) tw.done();
    }
  }

  /* 上一道题选了哪些心情，下一道题的光粒就用哪些颜色，按权重大致分 */
  var currentWeights = null;

  function recolorParticles(weights, instant) {
    if (!orbit) return;

    currentWeights = weights;
    var ps = orbit.particles;
    var now = performance.now() / 1000;
    var total = 0;
    var stops = [];

    if (weights) {
      for (var i = 0; i < DIM_ORDER.length; i++) {
        var w = weights[DIM_ORDER[i]] || 0;
        if (w > 0) {
          total += w;
          stops.push({ i: i, upTo: total });
        }
      }
    }

    for (var j = 0; j < ps.length; j++) {
      var p = ps[j];
      var to = p.base;

      if (total > 0) {
        var r = p.pick * total;
        to = stops[stops.length - 1].i;
        for (var k = 0; k < stops.length; k++) {
          if (r <= stops[k].upTo) { to = stops[k].i; break; }
        }
      }

      if (instant) {
        p.from = to;
        p.to = to;
        p.mixStart = -10;
      } else if (to !== p.to) {
        p.from = p.to;
        p.to = to;
        p.mixStart = now;
      }
    }
  }

  function applyQuizColors(qi) {
    if (!orbit) return;

    var weights = null;
    if (qi > 0) {
      var prev = QS[qi - 1];
      var ans = state.answers[qi - 1];
      if (prev && prev.opts[ans]) weights = prev.opts[ans].w;
    }
    recolorParticles(weights);
  }

  /* ---------------------------------------------------------
     收束之后：环高速转，选中的那朵去顶上，再落到结果页的花上
     --------------------------------------------------------- */
  var handoff = null;
  var handoffCv = null, handoffCtx = null, handoffDpr = 1, handoffW = 0, handoffH = 0;

  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function startLoadingSpin() {
    if (!orbit) return;
    orbit.mode = 'loading';
    orbit.spinTarget = 8.5;
    orbit.particleTarget = 0;
    orbit.othersAlpha = 1;
    orbit.chosen = -1;
    orbit.chosenVisible = true;
  }

  function prepareHandoffCanvas() {
    handoffCv = handoffCv || document.getElementById('handoff');
    handoffW = window.innerWidth;
    handoffH = window.innerHeight;
    handoffDpr = Math.min(window.devicePixelRatio || 1, 2);
    handoffCv.width = Math.round(handoffW * handoffDpr);
    handoffCv.height = Math.round(handoffH * handoffDpr);
    handoffCtx = handoffCv.getContext('2d');
    handoffCtx.setTransform(handoffDpr, 0, 0, handoffDpr, 0, 0);
    handoffCtx.imageSmoothingEnabled = false;
  }

  function beginHandoff(prep) {
    if (!orbit || !prep || !prep.rect) {
      if (prep) { endStageHold(); revealResult(); }
      return;
    }

    prepareHandoffCanvas();
    if (!handoffCv) {
      endStageHold();
      revealResult();
      return;
    }

    var idx = window.FLOWER_ORDER.indexOf(prep.id);
    if (idx < 0) idx = 0;

    orbit.mode = 'handoff';
    orbit.spinSpeed = 0;
    orbit.spinTarget = 0;
    orbit.chosen = idx;
    orbit.othersAlpha = 0;
    orbit.chosenVisible = true;

    var step = Math.PI * 2 / orbit.flowers.length;
    var from = -Math.PI / 2 + orbit.spin + idx * step;
    var delta = (-Math.PI / 2 - from) % (Math.PI * 2);
    if (delta > Math.PI) delta -= Math.PI * 2;
    if (delta < -Math.PI) delta += Math.PI * 2;

    orbit.chosenAngle = from;

    var w = window.innerWidth, h = window.innerHeight;
    var R = orbit.ring * orbit.ringScale;

    handoff = {
      start: performance.now(),
      from: from,
      delta: delta,
      rect: prep.rect,
      img: orbit.flowers[idx].img,
      glow: orbit.flowers[idx].glow,
      cx: w / 2,
      cy: h / 2,
      topX: w / 2,
      topY: h / 2 - R,
      fs: orbit.fs,
      stageX: prep.rect.x + prep.rect.width / 2,
      stageY: prep.rect.y + prep.rect.height / 2,
      stageW: prep.rect.width,
      detached: false,
      revealed: false,
      landed: false
    };

    var wait = document.querySelector('#s-loading .waiting');
    if (wait) wait.classList.add('out');

    prepareHandoffCanvas();
    handoffCv.classList.add('on');
  }

  function drawHandoff(x, y, size, glowMix) {
    if (!handoffCtx) return;
    var ctx = handoffCtx;
    ctx.clearRect(0, 0, handoffW, handoffH);

    if (handoff.glow && glowMix < 0.99) {
      var gs = size * 2.6;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.55 * (1 - glowMix);
      ctx.drawImage(handoff.glow, x - gs / 2, y - gs / 2, gs, gs);
      ctx.restore();
    }

    var gr = ctx.createRadialGradient(x, y, 0, x, y, size * 0.62);
    gr.addColorStop(0, 'rgba(190,58,52,.15)');
    gr.addColorStop(0.7, 'rgba(190,58,52,0)');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.arc(x, y, size * 0.62, 0, Math.PI * 2);
    ctx.fill();

    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(handoff.img, x - size / 2, y - size / 2, size, size);
  }

  function endStageHold() {
    var st = document.querySelector('#card .stage');
    if (st) st.classList.remove('hold');
  }

  function finishHandoff() {
    hideHandoff();
    endStageHold();
    handoff = null;
    if (orbit) orbit.mode = 'done';
  }

  function hideHandoff() {
    if (!handoffCv) return;
    handoffCv.classList.remove('on');
    if (handoffCtx) handoffCtx.clearRect(0, 0, handoffW, handoffH);
  }

  function updateHandoff(now) {
    if (!handoff || !orbit) return;
    var p = now - handoff.start;

    if (p < 400) {
      var e = easeInOutCubic(p / 400);
      orbit.chosenAngle = handoff.from + handoff.delta * e;
      return;
    }

    if (!handoff.detached) {
      handoff.detached = true;
      orbit.chosenVisible = false;
      orbit.chosenAngle = -Math.PI / 2;
    }

    if (p < 1150) {
      var e2 = easeInOutCubic((p - 400) / 750);
      var x = handoff.topX + (handoff.cx - handoff.topX) * e2;
      var y = handoff.topY + (handoff.cy - handoff.topY) * e2;
      var size = handoff.fs + (240 - handoff.fs) * e2;
      drawHandoff(x, y, size, e2);
      return;
    }

    if (p < 1900) {
      var e3 = easeInOutCubic((p - 1150) / 750);
      var x3 = handoff.cx + (handoff.stageX - handoff.cx) * e3;
      var y3 = handoff.cy + (handoff.stageY - handoff.cy) * e3;
      var size3 = 240 + (handoff.stageW - 240) * e3;
      drawHandoff(x3, y3, size3, 1);
      return;
    }

    if (!handoff.revealed) {
      handoff.revealed = true;
      revealResult();
    }

    /* 花已经落在花笺的位置上，等花笺淡进来再把它交给下面的 canvas */
    drawHandoff(handoff.stageX, handoff.stageY, handoff.stageW, 1);

    if (p >= 2450 && !handoff.landed) {
      handoff.landed = true;
      finishHandoff();
    }
  }

  function stageHoldOff() {
    endStageHold();
  }

  function orbitProject(o, p) {
    var y = p.y * o.ct - p.z * o.st;
    var z = p.y * o.st + p.z * o.ct;
    var k = o.cam / (o.cam - z);
    return { x: o.size / 2 + p.x * k, y: o.size / 2 + y * k, z: z, k: k };
  }

  /* 球面上一条各自乱走的曲线：同一颗粒子在 t 与 t-dt 上采样，就是拖尾 */
  function particlePos(p, t, o) {
    var r = o.cloud * p.r * (1 + 0.07 * Math.sin(t * 0.9 + p.p3));
    var ca = Math.cos(p.a * t + p.p1), sa = Math.sin(p.a * t + p.p1);
    var cb = Math.cos(p.b * t + p.p2), sb = Math.sin(p.b * t + p.p2);
    return { x: r * ca * cb, y: r * sa, z: r * ca * sb };
  }

  /* 每朵花自己的颜色糊成一层光，比统一白光更像花在发光 */
  function makeFlowerGlow(img) {
    var c = document.createElement('canvas');
    c.width = 128; c.height = 128;
    var g = c.getContext('2d');
    if (typeof g.filter !== 'string') return null;
    g.filter = 'blur(11px)';
    g.globalAlpha = .9;
    g.drawImage(img, 32, 32, 64, 64);
    return c;
  }

  function buildOrbit() {
    var host = document.getElementById('ambient');
    var backCv = document.getElementById('orbit-canvas');
    var frontCv = document.getElementById('orbit-front');
    if (!host || !backCv || !frontCv || !window.FLOWERS || !window.FLOWER_ORDER) return;

    var size = host.clientWidth;
    if (!size) return;

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    [backCv, frontCv].forEach(function (cv) {
      cv.width = Math.round(size * dpr);
      cv.height = Math.round(size * dpr);
      var c = cv.getContext('2d');
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.imageSmoothingEnabled = false;
    });

    var flowers = window.FLOWER_ORDER.map(function (id) {
      var f = window.FLOWERS[id];
      var off = document.createElement('canvas');
      off.width = 64;
      off.height = 64;
      var c = off.getContext('2d');
      c.imageSmoothingEnabled = false;
      f.draw(c, 0);
      return { img: off, glow: makeFlowerGlow(off) };
    });

    var count = size < 480 ? 65 : 100;
    var particles = [];
    for (var i = 0; i < count; i++) {
      var near = Math.random() < 0.4;
      particles.push({
        base: i % 6,
        from: i % 6,
        to: i % 6,
        mixStart: -10,
        pick: Math.random(),
        r: near ? 0.06 + Math.random() * 0.46 : 0.5 + Math.pow(Math.random(), 0.6) * 0.5,
        a: 1.2 + Math.random() * 1.9,
        b: 0.6 + Math.random() * 1.3,
        p1: Math.random() * Math.PI * 2,
        p2: Math.random() * Math.PI * 2,
        p3: Math.random() * Math.PI * 2,
        s: 0.9 + Math.random() * 1.5
      });
    }

    var tilt = 0.32;
    var prevScale = orbit ? orbit.ringScale : 1;
    var prevTarget = orbit ? orbit.ringTarget : 1;
    orbit = {
      back: backCv.getContext('2d'),
      front: frontCv.getContext('2d'),
      size: size,
      flowers: flowers,
      particles: particles,
      ring: size * 0.39,
      ringScale: prevScale,
      ringTarget: prevTarget,
      fs: Math.max(46, Math.min(84, size * 0.125)),
      cloud: size * 0.235,
      cam: size * 0.68,
      ct: Math.cos(tilt),
      st: Math.sin(tilt),
      trail: size < 480 ? 26 : 40,
      mode: 'normal',
      spin: 0,
      spinSpeed: 0.09,
      spinTarget: 0.09,
      particleAlpha: 1,
      particleTarget: 1,
      chosen: -1,
      chosenVisible: true,
      chosenAngle: 0,
      othersAlpha: 1
    };

    drawOrbit(0);
  }

  function drawParticle(ctx, p, t, o, head) {
    var pa = o.particleAlpha;
    if (pa <= 0.01) return;

    var pts = [head];
    var k;
    var dt = 0.46 / o.trail;
    for (k = 1; k <= o.trail; k++) {
      pts.push(orbitProject(o, particlePos(p, t - k * dt, o)));
    }

    var mix = Math.min(1, (t - p.mixStart) / 0.9);
    var rgb = p.from === p.to
      ? PALETTE_RGB[p.to]
      : mixRgb(PALETTE_RGB[p.from], PALETTE_RGB[p.to], mix);
    var depth = Math.max(0, Math.min(1, (head.z / o.cloud + 1) / 2));
    var alpha = 0.3 + depth * 0.7;
    var n = pts.length;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    /* 像素拖尾：一小格一小格地淡出去 */
    for (k = n - 1; k >= 1; k--) {
      var q = pts[k];
      var f = 1 - k / (n - 1);
      var sz = f > 0.55 ? 3 : (f > 0.25 ? 2 : 1);
      var a = (0.14 + f * 0.55) * alpha * pa;
      ctx.fillStyle = rgbaRgb(rgb, a);
      ctx.fillRect(Math.round(q.x) - (sz >> 1), Math.round(q.y) - (sz >> 1), sz, sz);
    }

    /* 像素头：几层方块光 + 色块 + 1 像素白芯 */
    var hx = Math.round(head.x), hy = Math.round(head.y);
    var core = Math.max(3, Math.round((2.0 + p.s * 0.6) * head.k));
    var s1 = core + 3;
    var s2 = core + 5;
    var s3 = core + 8;

    ctx.fillStyle = rgbaRgb(rgb, 0.08 * alpha * pa);
    ctx.fillRect(hx - (s3 >> 1), hy - (s3 >> 1), s3, s3);
    ctx.fillStyle = rgbaRgb(rgb, 0.16 * alpha * pa);
    ctx.fillRect(hx - (s2 >> 1), hy - (s2 >> 1), s2, s2);
    ctx.fillStyle = rgbaRgb(rgb, 0.36 * alpha * pa);
    ctx.fillRect(hx - (s1 >> 1), hy - (s1 >> 1), s1, s1);
    ctx.fillStyle = rgbaRgb(rgb, 0.98 * alpha * pa);
    ctx.fillRect(hx - (core >> 1), hy - (core >> 1), core, core);
    ctx.fillStyle = 'rgba(255,255,255,' + (0.95 * pa) + ')';
    ctx.fillRect(hx, hy, 1, 1);

    ctx.restore();
  }

  function drawOrbit(t) {
    var o = orbit;
    if (!o) return;

    var S = o.size, c = S / 2;
    var back = o.back, front = o.front;
    back.clearRect(0, 0, S, S);
    front.clearRect(0, 0, S, S);

    /* 花环轨道：极淡的一圈虚线 */
    var R = o.ring * o.ringScale;
    back.save();
    back.beginPath();
    back.setLineDash([2, 9]);
    back.arc(c, c, R, 0, Math.PI * 2);
    back.globalAlpha = o.mode === 'handoff' ? o.othersAlpha : 1;
    back.strokeStyle = 'rgba(242,235,223,.06)';
    back.lineWidth = 1;
    back.stroke();
    back.restore();

    /* 十五朵花：平面圆环，慢慢转，花头始终朝上；每朵带一层自己的光 */
    var n = o.flowers.length;
    var step = Math.PI * 2 / n;
    var baseSpin = -Math.PI / 2 + o.spin;

    for (var i = 0; i < n; i++) {
      var alpha = 1;
      var a = baseSpin + i * step;

      if (o.mode === 'handoff') {
        if (i === o.chosen) {
          if (!o.chosenVisible) continue;
          a = o.chosenAngle;
        } else {
          alpha = o.othersAlpha;
        }
      }

      var x = c + Math.cos(a) * R;
      var y = c + Math.sin(a) * R;
      var f = o.flowers[i];
      var gs = o.fs * 2.6;

      back.save();
      back.globalAlpha = alpha;

      if (f.glow) {
        back.save();
        back.globalCompositeOperation = 'lighter';
        back.globalAlpha = 0.55 * alpha;
        back.drawImage(f.glow, x - gs / 2, y - gs / 2, gs, gs);
        back.restore();
      }

      back.drawImage(f.img, x - o.fs / 2, y - o.fs / 2, o.fs, o.fs);
      back.restore();
    }

    /* 中心光粒：每颗一条球面乱线，带拖尾；按前后分两层画 */
    for (var p = 0; p < o.particles.length; p++) {
      var part = o.particles[p];
      var head = orbitProject(o, particlePos(part, t, o));
      drawParticle(head.z > 0 ? front : back, part, t, o, head);
    }
  }

  /* ---------------------------------------------------------
     动画：只有花笺上的那一朵在动，整数位移
     --------------------------------------------------------- */
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var lastFrameTime = performance.now();

  function frame(now) {
    var t = now / 1000;
    var dt = Math.min(0.05, Math.max(0, (now - lastFrameTime) / 1000));
    lastFrameTime = now;

    stepAmbient(now);

    if (orbit) {
      orbit.spinSpeed += (orbit.spinTarget - orbit.spinSpeed) * Math.min(1, dt * 7);
      orbit.spin += orbit.spinSpeed * dt;
      orbit.particleAlpha += (orbit.particleTarget - orbit.particleAlpha) * Math.min(1, dt * 8);
      if (Math.abs(orbit.ringTarget - orbit.ringScale) > 0.001) {
        orbit.ringScale += (orbit.ringTarget - orbit.ringScale) * Math.min(1, dt * 4);
      }
    }

    if (handoff) updateHandoff(now);

    if (orbit && !reduce && (current === 'intro' || current === 'quiz' || current === 'loading')) drawOrbit(t);
    if (live && current === 'result') {
      var ctx = live.ctx;
      var sway = reduce ? 0 : Math.round(Math.sin(t * 0.62) * 1.4);
      ctx.clearRect(0, 0, 64, 64);
      ctx.save();
      ctx.translate(sway, 0);
      live.draw(ctx, reduce ? 0 : t);
      ctx.restore();
      if (!reduce) {
        for (var k = 0; k < live.pollen.length; k++) {
          var p = live.pollen[k];
          var y = ((p.y0 - t * p.v) % 78 + 78) % 78 - 6;
          var x = p.x + Math.sin(t * 0.7 + p.ph) * 3;
          ctx.fillStyle = 'rgba(240,226,208,' + p.a + ')';
          ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
        }
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------------------------------------------------------
     接线
     --------------------------------------------------------- */
  ambEl = document.getElementById('ambient');
  pixelTitle($('.cover-head h1'), '今日花签', { base: 28, scale: 2, gap: 6 });
  buildOrbit();

  $('#start').addEventListener('click', startExperience);
  $('#back').addEventListener('click', back);

  window.addEventListener('resize', function () {
    clearTimeout(orbitTimer);
    orbitTimer = setTimeout(function () {
      buildOrbit();
      if (!orbit) return;
      if (current === 'quiz' || current === 'loading') {
        orbit.ringTarget = 0.43 / 0.39;
        recolorParticles(currentWeights, true);
      }
    }, 160);
  });

  /* 从花谱页点「返回」回来：跳过封面，直接把刚才那张花笺放回来 */
  (function () {
    var back = false, saved = null;
    try {
      back = sessionStorage.getItem(RETURN_KEY) === '1';
      sessionStorage.removeItem(RETURN_KEY);
      saved = sessionStorage.getItem(ANSWERS_KEY);
    } catch (e) { return; }
    if (!back || !saved) return;

    var answers;
    try { answers = JSON.parse(saved); } catch (e) { return; }
    if (!answers || answers.length !== QS.length) return;

    try {
      state.answers = answers;
      state.qi = QS.length - 1;
      state.locked = false;
      showResult();
    } catch (e) {}
  })();

  document.addEventListener('keydown', function (e) {
    if (current === 'intro' && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault(); startExperience(); return;
    }
    if (current !== 'quiz') return;

    var k = e.key;
    if (k >= '1' && k <= '4') { choose(parseInt(k, 10) - 1); return; }
    var idx = 'abcd'.indexOf(k.toLowerCase());
    if (idx >= 0) { choose(idx); return; }
    if (k === 'Backspace' || k === 'ArrowLeft') { e.preventDefault(); back(); }
  });
})();
</script>
